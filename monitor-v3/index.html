<script>
(function(){
  'use strict';
  const form=document.getElementById('accessForm'),input=document.getElementById('accessPassword'),error=document.getElementById('accessError'),submit=document.getElementById('unlockButton'),toggle=document.getElementById('togglePassword');
  const from64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  toggle.addEventListener('click',()=>{const show=input.type==='password';input.type=show?'text':'password';toggle.textContent=show?'隐藏':'显示';toggle.setAttribute('aria-label',show?'隐藏密码':'显示密码');toggle.setAttribute('aria-pressed',String(show));});
  form.addEventListener('submit',async e=>{
    e.preventDefault();if(submit.disabled)return;
    if(!globalThis.crypto?.subtle){error.textContent='请通过 HTTPS 链接在现代浏览器中打开。';return;}
    submit.disabled=true;submit.textContent='正在验证…';error.textContent='';
    try{
      const payload=JSON.parse(document.getElementById('encryptedPayload').textContent);
      const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(input.value),'PBKDF2',false,['deriveKey']);
      const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:from64(payload.salt),iterations:payload.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
      const clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:from64(payload.iv)},key,from64(payload.ciphertext));
      input.value='';const html=new TextDecoder().decode(clear);document.open();document.write(html);document.close();
    }catch(_){error.textContent='密码错误或页面数据异常，请核对密码后重试。';input.select();submit.disabled=false;submit.textContent='解锁并进入看板';}
  });
})();
</script></body></html>
