  function miniLine(values,color="#1769e0",w=260,h=64){
    const min=Math.min(...values),max=Math.max(...values),span=max-min||1;
    const pts=values.map((v,i)=>`${(i/(values.length-1))*w},${h-6-((v-min)/span)*(h-14)}`).join(" ");
    return `<svg viewBox="0 0 ${w} ${h}" class="chart-svg" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`
  }
  function lineChart(series,height=225){
    const w=720,h=height,p={l:42,r:18,t:18,b:28};let all=series.flatMap(s=>s.values),min=Math.min(...all),max=Math.max(...all),span=max-min||1;
    const y=v=>p.t+(h-p.t-p.b)*(1-(v-min)/span),x=i=>p.l+(w-p.l-p.r)*i/(series[0].values.length-1);
    const grid=Array.from({length:5},(_,i)=>{const yy=p.t+i*(h-p.t-p.b)/4,val=(max-i*span/4).toFixed(max<10?1:0);return `<line x1="${p.l}" y1="${yy}" x2="${w-p.r}" y2="${yy}" class="chart-grid"/><text x="4" y="${yy+3}" class="chart-label">${val}</text>`}).join("");
    const lines=series.map(s=>{const pts=s.values.map((v,i)=>`${x(i)},${y(v)}`).join(" ");return `<polyline points="${pts}" class="chart-line" stroke="${s.color}"/>`}).join("");
    const labels=["08:00","10:00","12:00","14:00","16:00","18:00"].map((l,i)=>`<text x="${p.l+i*(w-p.l-p.r)/5}" y="${h-5}" text-anchor="middle" class="chart-label">${l}</text>`).join("");
    return `<svg viewBox="0 0 ${w} ${h}" class="chart-svg" preserveAspectRatio="none">${grid}${lines}${labels}</svg>`
  }

  });
  document.addEventListener("change",e=>{if(e.target.matches("select[data-table-filter]"))filterCurrent(e.target.value)});
  document.addEventListener("keydown",e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();document.getElementById("globalSearch").focus()}if(e.key==="Escape"){closeFloating();document.querySelectorAll(".popover").forEach(x=>x.remove())}});
  document.addEventListener("click",e=>{if(!e.target.closest(".popover")&&!e.target.closest("[data-action='notifications']")&&!e.target.closest("#globalSearch"))document.querySelectorAll(".popover").forEach(x=>x.remove())});

  renderNav();renderTabs();renderPage();
  setInterval(()=>{const p=document.querySelector(".top-title p");if(p){const now=new Date();p.textContent=`设备管理业务平台 · ${now.toLocaleDateString("zh-CN")} ${now.toLocaleTimeString("zh-CN",{hour12:false})}`}},1000);
  </script>
</body>
</html>
