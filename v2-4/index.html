    else if(a==="toggle-user"){const u=state.users.find(x=>x.account===id);if(u)u.status=u.status==="启用"?"停用":"启用";renderPage();toast("用户状态已切换",`${u.name} 当前为${u.status}`)}
    else if(a==="toggle-push"){const r=state.pushRules.find(x=>x.id===id);if(r)r.status=r.status==="启用"?"停用":"启用";renderPage();toast("推送规则状态已切换",`${r.name} 当前为${r.status}`)}
    else if(a==="toggle-generic")toast("状态已切换","演示记录状态已更新");
    else if(a==="api-doc")showApiDoc(id);
    else if(a==="api-auth")showApiAuth(id);
    else if(a==="view-api")showApiMonitor(id);
    else if(a==="toggle-api"){const x=state.apiServices.find(v=>v.id===id);if(x)x.status=x.status==="已发布"?"停用":"已发布";renderPage();toast("接口状态已更新",`${x.name} 当前为${x.status}`)}
    else if(a==="copy-key")toast("已复制授权 Key","密钥仅在创建时完整展示");
    else if(a==="approval-modal")openModal("接口申请审批",table(["申请方","申请接口","权限","申请时间","操作"],[`<tr><td>生产运营平台</td><td>设备状态汇总</td><td>只读</td><td>14:02</td><td><button class="action-link" data-action="modal-success">通过</button></td></tr>`,`<tr><td>算法模型服务</td><td>测点历史数据</td><td>查询</td><td>11:38</td><td><button class="action-link" data-action="modal-success">通过</button></td></tr>`],3),btn("关闭","close-floating"),true);
    else if(a==="indicator-def")openModal("指标定义",table(["指标名称","计算公式","数据来源","周期"],[`<tr><td>开机率</td><td>开机时长 / 统计时长</td><td>设备状态</td><td>日、月</td></tr>`,`<tr><td>运行率</td><td>有效运行时长 / 开机时长</td><td>设备状态</td><td>日、月</td></tr>`,`<tr><td>故障率</td><td>故障设备数 / 设备总数</td><td>设备状态与报警</td><td>日、月</td></tr>`],8),btn("关闭","close-floating")+btn("新增指标","modal-success","primary"),true);
    else if(a==="generate-report"){toast("报告生成完成","已基于截至 15:12 的质量校验结果刷新报告");renderPage()}
    else if(a==="mark-all-read"){state.messages.forEach(m=>m.read=true);document.getElementById("notifyBadge").style.display="none";document.querySelectorAll(".popover").forEach(x=>x.remove());renderPage();toast("消息已全部标记为已读")}
    else if(a==="open-message"){const m=state.messages.find(x=>x.id===Number(id));if(m){m.read=true;document.querySelectorAll(".popover").forEach(x=>x.remove());navigate(m.target)}}
    else if(a==="connection-test"||a==="batch-test"){toast("连通测试成功","连接、鉴权与响应时间均正常")}
    else if(a==="chain-detail")showChainDetail(id);
    else if(a==="view-generic")genericDetail(el.dataset.title||"记录详情");
    else if(a==="open-bigscreen")openModal("监盘看板联动说明",`<div class="notice">${icon("layers")}车间三维监盘看板属于另案建设范围。本原型仅验证业务平台与大屏之间的告警推送和设备详情跳转关系。</div><div class="desc-grid" style="grid-template-columns:repeat(2,1fr);margin-top:14px"><div class="desc-item"><small>业务平台 → 大屏</small><b>推送告警事件并触发设备高亮</b></div><div class="desc-item"><small>大屏 → 业务平台</small><b>点击设备跳转设备详情页</b></div></div>`,btn("关闭","close-floating")+btn("模拟从大屏返回设备详情","bigscreen-return","primary"));
    else if(a==="bigscreen-return"){closeFloating();navigate("device-detail");toast("联动跳转成功","已定位到对应设备详情与实时数据")}
  });
  document.addEventListener("input",e=>{
    if(e.target.id==="menuSearch")renderNav(e.target.value);
    else if(e.target.id==="globalSearch")showGlobalResults(e.target.value);
    else if(e.target.matches("[data-table-filter]"))filterCurrent(e.target.value)
  });
  document.addEventListener("change",e=>{if(e.target.matches("select[data-table-filter]"))filterCurrent(e.target.value)});
  document.addEventListener("keydown",e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();document.getElementById("globalSearch").focus()}if(e.key==="Escape"){closeFloating();document.querySelectorAll(".popover").forEach(x=>x.remove())}});
  document.addEventListener("click",e=>{if(!e.target.closest(".popover")&&!e.target.closest("[data-action='notifications']")&&!e.target.closest("#globalSearch"))document.querySelectorAll(".popover").forEach(x=>x.remove())});

  renderNav();renderTabs();renderPage();
  </script>
