  <script>(function(){
  'use strict';
  // Mount inside the child's own event context so document.open preserves its app URL and query.
  if(window.parent!==window){
    window.addEventListener('message',e=>{
      if(e.source!==window.parent||e.origin!==location.origin||e.data?.namespace!=='504-application-portal'||e.data.action!=='mount-application'||typeof e.data.html!=='string')return;
      document.open();document.write(e.data.html);document.close();
    });
    return;
  }
  const $=id=>document.getElementById(id),bundle=JSON.parse($('encryptedApplications').textContent);
  const names={'v2-5':'数据中台','monitor-v3':'大屏监盘'},views=[$('loginView'),$('portalView'),$('applicationView')];
  const input=$('accessPassword'),submit=$('unlockButton'),toggle=$('togglePassword');
  const cache=new Map();let material=null,frame=null,sequence=0,timeout=null;
  const from64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const title=view=>document.title='生产数据智能监盘系统 · '+view;
  function show(view){views.forEach(el=>el.hidden=el.id!==view);window.scrollTo(0,0);}
  function buttons(disabled){document.querySelectorAll('[data-application]').forEach(el=>el.disabled=disabled);}
  function clearFrame(){clearTimeout(timeout);timeout=null;if(frame){frame.remove();frame=null;}$('applicationView').replaceChildren();$('applicationLoading').hidden=true;buttons(false);}
  function showPortal(message=''){
    sequence++;clearFrame();if(!material)return logout();
    $('portalError').textContent=message;show('portalView');title('应用门户');$('portalHeading').focus();
  }
  function logout(){
    sequence++;material=null;cache.clear();clearFrame();input.value='';input.type='password';toggle.textContent='显示';toggle.setAttribute('aria-label','显示密码');toggle.setAttribute('aria-pressed','false');
    $('accessError').textContent='';$('portalError').textContent='';submit.disabled=false;submit.innerHTML='登录<span aria-hidden="true">→</span>';show('loginView');title('登录');
  }
  async function decrypt(id,keyMaterial){
    const p=bundle.apps[id];if(!p)throw new Error('Unknown application');
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:from64(p.salt),iterations:p.iterations,hash:'SHA-256'},keyMaterial,{name:'AES-GCM',length:256},false,['decrypt']);
    const bytes=await crypto.subtle.decrypt({name:'AES-GCM',iv:from64(p.iv)},key,from64(p.ciphertext));
    return new TextDecoder().decode(bytes);
  }
  toggle.addEventListener('click',()=>{const show=input.type==='password';input.type=show?'text':'password';toggle.textContent=show?'隐藏':'显示';toggle.setAttribute('aria-label',show?'隐藏密码':'显示密码');toggle.setAttribute('aria-pressed',String(show));});
  $('accessForm').addEventListener('submit',async e=>{
    e.preventDefault();if(submit.disabled)return;if(!globalThis.crypto?.subtle){$('accessError').textContent='请通过 HTTPS 链接在现代浏览器中打开。';return;}
    const request=++sequence;submit.disabled=true;submit.textContent='正在验证…';$('accessError').textContent='';
    try{
      const bytes=new TextEncoder().encode(input.value);let candidate;
      try{candidate=await crypto.subtle.importKey('raw',bytes,'PBKDF2',false,['deriveKey']);}finally{bytes.fill(0);}
      const html=await decrypt(bundle.entry,candidate);if(request!==sequence)return;
      input.value='';material=candidate;cache.set(bundle.entry,html);showPortal();
    }catch(_){if(request!==sequence)return;$('accessError').textContent='密码错误或页面数据异常，请核对后重试。';input.select();}
    finally{if(request===sequence||material){submit.disabled=false;submit.innerHTML='登录<span aria-hidden="true">→</span>';}}
  });
  async function openApplication(id,search=null,hash=''){
    if(!material||!Object.hasOwn(names,id))return;
    const request=++sequence;clearFrame();buttons(true);$('portalError').textContent='';$('loadingText').textContent='正在进入'+names[id]+'…';$('applicationLoading').hidden=false;
    timeout=setTimeout(()=>{if(request===sequence)showPortal('应用打开超时，请重试。');},25000);
    try{
      const html=cache.get(id)||await decrypt(id,material);if(request!==sequence)return;cache.set(id,html);
      const appUrl=new URL('../'+id+'/',location.href);
      if(typeof search==='string')appUrl.search=search;
      else if(id===bundle.entry)appUrl.search=location.search;
      if(typeof hash==='string')appUrl.hash=hash;
      appUrl.searchParams.set('__portalBuild','20261016-1');
      const base=document.createElement('base');base.href=appUrl.href;
      const documentHtml=html.replace(/<head(?:\s[^>]*)?>/i,m=>m+base.outerHTML);
      const appFrame=document.createElement('iframe');appFrame.title=names[id];appFrame.setAttribute('allow','fullscreen');appFrame.setAttribute('referrerpolicy','no-referrer');
      appFrame.addEventListener('load',()=>{
        if(request!==sequence||appFrame!==frame)return;
        try{appFrame.contentWindow.postMessage({namespace:'504-application-portal',action:'mount-application',html:documentHtml},location.origin);}
        catch(_){if(request===sequence)showPortal('应用加载失败，请重新进入。');}
      },{once:true});
      // Lay out the application behind the loading mask so its charts receive real viewport dimensions.
      show('applicationView');appFrame.src=appUrl.href;frame=appFrame;$('applicationView').append(appFrame);
    }catch(_){if(request===sequence)showPortal('应用验证失败，请退出后重新登录。');}
  }
  document.querySelectorAll('[data-application]').forEach(button=>button.addEventListener('click',()=>openApplication(button.dataset.application)));
  $('portalLogout').addEventListener('click',logout);$('cancelApplication').addEventListener('click',()=>showPortal());
  document.querySelector('.brand[href]').addEventListener('click',e=>e.preventDefault());
  window.addEventListener('message',e=>{
    if(!frame||e.source!==frame.contentWindow||e.origin!==location.origin||e.data?.namespace!=='504-application-portal')return;
    if(e.data.action==='portal-bridge-ready'){clearTimeout(timeout);timeout=null;$('applicationLoading').hidden=true;buttons(false);show('applicationView');title(names[e.data.app]||'应用');frame.focus();}
    else if(e.data.action==='return-portal')showPortal();
    else if(e.data.action==='logout')logout();
    else if(e.data.action==='open-application')openApplication(e.data.app,e.data.search,e.data.hash);
  });
  // Authentication only lives in this document's memory. No password, key or login flag is persisted.
  window.addEventListener('pagehide',logout);
  window.addEventListener('pageshow',e=>{if(e.persisted)logout();});
})();
</script>
</body>
</html>
